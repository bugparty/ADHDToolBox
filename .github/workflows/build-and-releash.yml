name: Build and Release Qt6 Project

on:
  push:
    branches:
      - master
      - ci
      - 'claude/**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-2019, macos-latest]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.7.2'
        target: 'desktop'
        dir:  ${{ runner.temp }}

    - name: Set up Visual Studio shell
      if: matrix.os == 'windows-2019'
      uses: egor-tensin/vs-shell@v2
      with:
          arch: x64

    - name: Build Project (Linux/macOS)
      if: matrix.os == 'ubuntu-latest' || matrix.os == 'macos-latest'
      run: |
        mkdir build
        cd build
        qmake CONFIG+=release CONFIG-=debug ../analogclock/analogclock.pro
        make -j$(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo 2)
        ls -l
      shell: bash

    - name: Build Project (Windows)
      if: matrix.os == 'windows-2019'
      run: |
        mkdir build
        cd build
        qmake CONFIG+=release CONFIG-=debug ../analogclock/analogclock.pro
        nmake
        dir
        cd release
        windeployqt --qmldir . analogclock.exe --release --compiler-runtime
        copy C:\Windows\System32\concrt140.dll . 2>nul || echo "concrt140.dll not found"
        copy C:\Windows\System32\vccorlib140.dll . 2>nul || echo "vccorlib140.dll not found"
        copy C:\Windows\System32\msvcp140.dll . 2>nul || echo "msvcp140.dll not found"
        copy C:\Windows\System32\vcruntime140.dll . 2>nul || echo "vcruntime140.dll not found"
        dir
      shell: cmd

    - name: Upload Artifact (Linux)
      if: matrix.os == 'ubuntu-latest'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.os }}-analogclock
        path:  build/analogclock

    - name: Upload Artifact (Windows)
      if: matrix.os == 'windows-2019'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.os }}-analogclock
        path:  |
          build/release/analogclock.exe
          build/release/*.dll

    - name: Upload Artifact (macOS)
      if: matrix.os == 'macos-latest'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.os }}-analogclock
        path:  build/analogclock.app

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download Artifacts
      uses: actions/download-artifact@v4
      with:
        path: ./artifacts

    - name: Debug - List artifacts
      run: ls -R ./artifacts

    - name: Archive binaries
      run: |
        cd artifacts
        zip -r ../analogclock-linux.zip ubuntu-latest-analogclock
        zip -r ../analogclock-macos.zip macos-latest-analogclock
        zip -r ../analogclock-windows.zip windows-2019-analogclock
        cd ..
        ls -lh *.zip
      shell: bash

    - name: Create Release
      uses: ncipollo/release-action@v1
      with:
        artifacts: |
          ./analogclock-linux.zip
          ./analogclock-windows.zip
          ./analogclock-macos.zip
        token: ${{ secrets.GITHUB_TOKEN }}
        tag: ${{ github.ref_name }}
        name: Release ${{ github.ref_name }}
        body: |
          ## ADHD ToolBox Release ${{ github.ref_name }}

          ### Downloads
          - **Linux**: analogclock-linux.zip
          - **Windows**: analogclock-windows.zip
          - **macOS**: analogclock-macos.zip

          ### Changes
          Built from commit ${{ github.sha }}
        draft: false
        prerelease: false
